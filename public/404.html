<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Page not found | Alexander Cremer</title>
  <!--
    GitHub Pages serves this file at ANY missing URL, however deep, so relative
    paths would break here. Styles are therefore inline and the home link is
    root-absolute. If the repo is renamed to SpektakularaAlex.github.io, change
    "/My_website/" below to "/".
  -->
  <style>
    :root { color-scheme: light dark; --bg: #fff; --text: #1c1e21; --muted: #555b63; --accent: #0046a0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15171a; --text: #e4e5e7; --muted: #a3a9b1; --accent: #8ab6f5; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 1.0625rem/1.55 Georgia, "Times New Roman", serif; }
    main { max-width: 36rem; margin: 0 auto; padding: 4.5rem 1.25rem; }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; line-height: 1.2; }
    p { margin: 0 0 1rem; color: var(--muted); }
    a { color: var(--accent); text-underline-offset: 0.18em; }
  </style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>There is nothing at this address.</p>
  <p><a href="/My_website/">Back to Alexander Cremer’s home page</a></p>
</main>
</body>
</html>
